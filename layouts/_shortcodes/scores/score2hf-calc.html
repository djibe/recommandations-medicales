<script>
// SCORE2-HF by djibe
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('score-form');
    const calculateBtn = document.getElementById('calculate-btn');
    const resultSection = document.getElementById('result-section');
    const errorSection = document.getElementById('error-section');

    // Toggle div-diabete visibility
    const diabetesRadios = document.querySelectorAll('input[name="diabetes"]');
    const divDiabete = document.getElementById('div-diabete');

    diabetesRadios.forEach(radio => {
        radio.addEventListener('change', function() {
            if (this.value === '1') {
                divDiabete.classList.add('show');
            } else {
                divDiabete.classList.remove('show');
            }
        });
    });

    calculateBtn.addEventListener('click', function() {
        try {
            // 1. Retrieve Form Inputs
            const gender = document.querySelector('input[name="gender"]:checked').value;
            const smoker = parseInt(document.querySelector('input[name="smoker"]:checked').value);
            const diabetes = parseInt(document.querySelector('input[name="diabetes"]:checked').value);
            const hbpPill = parseInt(document.querySelector('input[name="hbp-pill"]:checked').value);
            const age = parseFloat(document.getElementById('ageHF').value);
            const bmi = parseFloat(document.getElementById('bmi').value);
            const sbp = parseFloat(document.getElementById('sbp').value);
            const gfr = parseFloat(document.getElementById('gfr').value);

            // New Diabetes Parameters (Fallback to baseline if inputs are not yet in HTML)
            let agediab = 50;
            let hba1c = 31;

            if (document.getElementById('agediab')) {
                agediab = parseFloat(document.getElementById('agediab').value);
            }
            if (document.getElementById('hba1c')) {
                hba1c = parseFloat(document.getElementById('hba1c').value);
            }

            if (isNaN(age) || isNaN(bmi) || isNaN(sbp) || isNaN(gfr) || (diabetes === 1 && (isNaN(agediab) || isNaN(hba1c)))) {
                throw new Error("Veuillez remplir tous les champs numériques requis.");
            }

            const isMale = (gender === 'male');
            const gIdx = isMale ? 1 : 0; // Index 0 = Women, 1 = Men

            // Risk Factor Transformations
            const cage = (age - 60) / 5;
            const smallbin = smoker;
            const hypdbin = hbpPill;
            const csbp = (sbp - 120) / 20;
            const cbmi = (bmi - 25) / 5;
            const cbmi2 = cbmi * cbmi;
            const hxdiabbin = diabetes;
            const lnegfr = Math.log(gfr);
            const clnegfr = (lnegfr - 4.5) / 0.15;
            const clnegfr2 = clnegfr * clnegfr;

            // Interactions
            const csbp_hypdbin = csbp * hypdbin;
            const cage_smallbin = cage * smallbin;
            const cage_csbp = cage * csbp;
            const cage_hxdiabbin = cage * hxdiabbin;
            const cage_hypdbin = cage * hypdbin;
            const cage_cbmi = cage * cbmi;
            const cage_clnegfr = cage * clnegfr;

            // Diabetes specific interactions applied only if diabetes is present
            let cagediab_val = 0;
            let chba1c_val = 0;
            let cage_chba1c = 0;

            if (hxdiabbin === 1) {
                cagediab_val = (agediab - 50) / 5;
                chba1c_val = (hba1c - 31) / 9.34;
                cage_chba1c = cage * chba1c_val;
            }

            // Model Coefficients [Women, men]
            const coef = {
                cage: [0.5298, 0.4578],
                smallbin: [0.7219, 0.4956],
                hypdbin: [0.5420, 0.4629],
                csbp: [0.1460, 0.1456],
                cbmi: [0.3100, 0.3065],
                cbmi2: [-0.0058, 0.0027],
                hxdiabbin: [0.2690, 0.1493],
                clnegfr: [-0.0528, -0.0298],
                clnegfr2: [0.0045, 0.0046],
                csbp_hypdbin: [-0.0511, -0.0443],
                cage_smallbin: [-0.1064, -0.0624],
                cage_csbp: [-0.0096, -0.0227],
                cage_hxdiabbin: [0.0149, 0.0342],
                cage_hypdbin: [-0.0514, -0.0333],
                cage_cbmi: [-0.0257, -0.0154],
                cage_clnegfr: [0.0034, 0.0031],
                cagediab: [-0.0921, -0.0258],
                chba1c: [0.1182, 0.1058],
                cage_chba1c: [-0.0113, -0.0175]
            };

            // Linear Predictor Calculation
            const linearPredictor =
                cage * coef.cage[gIdx] +
                smallbin * coef.smallbin[gIdx] +
                hypdbin * coef.hypdbin[gIdx] +
                csbp * coef.csbp[gIdx] +
                cbmi * coef.cbmi[gIdx] +
                cbmi2 * coef.cbmi2[gIdx] +
                hxdiabbin * coef.hxdiabbin[gIdx] +
                clnegfr * coef.clnegfr[gIdx] +
                clnegfr2 * coef.clnegfr2[gIdx] +
                csbp_hypdbin * coef.csbp_hypdbin[gIdx] +
                cage_smallbin * coef.cage_smallbin[gIdx] +
                cage_csbp * coef.cage_csbp[gIdx] +
                cage_hxdiabbin * coef.cage_hxdiabbin[gIdx] +
                cage_hypdbin * coef.cage_hypdbin[gIdx] +
                cage_cbmi * coef.cage_cbmi[gIdx] +
                cage_clnegfr * coef.cage_clnegfr[gIdx] +
                cagediab_val * coef.cagediab[gIdx] +
                chba1c_val * coef.chba1c[gIdx] +
                cage_chba1c * coef.cage_chba1c[gIdx];

            // Uncalibrated 10-year Risk
            const baseSurv = isMale ? 0.9885 : 0.9924;
            const uncalRisk10 = 1 - Math.pow(baseSurv, Math.exp(linearPredictor));

            // Recalibration Factors Dictionary [Women, Men]
            const recalibrationFactors = {
                'low': {
                    '10-year': { scale1: [-0.0229, 0.2247], scale2: [0.8181, 0.8758] },
                    '30-year': { scale1: [1.6742, 1.2857], scale2: [0.7311, 0.6971] }
                },
                'moderate': {
                    '10-year': { scale1: [0.3562, 0.5441], scale2: [0.8511, 0.8695] },
                    '30-year': { scale1: [2.1173, 1.5053], scale2: [0.7724, 0.6786] }
                },
                'high': {
                    '10-year': { scale1: [0.7611, 0.7070], scale2: [0.7779, 0.7344] },
                    '30-year': { scale1: [1.6327, 0.7495], scale2: [0.5536, 0.3944] }
                },
                'very_high': {
                    '10-year': { scale1: [1.2640, 1.0927], scale2: [0.7459, 0.6785] },
                    '30-year': { scale1: [1.7426, 0.9650], scale2: [0.4598, 0.3275] }
                }
            };

            const activeRegion = 'low';

            // Final Calibrated Risk Calculation
            const logLogRisk = Math.log(-Math.log(1 - uncalRisk10));

            // 10-year risk computation
            const scale1_10 = recalibrationFactors[activeRegion]['10-year'].scale1[gIdx];
            const scale2_10 = recalibrationFactors[activeRegion]['10-year'].scale2[gIdx];
            const calibratedRisk10 = 1 - Math.exp(-Math.exp(scale1_10 + scale2_10 * logLogRisk));
            const percent10 = Math.round(calibratedRisk10 * 100);

            // 30-year risk computation (only for ages 40-59)
            let display30Year = `<br><span style="font-size: 1rem; font-weight: normal; color: var(--text-black-secondary);">30 ans : Non applicable (réservé aux 40-59 ans)</span>`;

            if (age >= 40 && age <= 59) {
                const scale1_30 = recalibrationFactors[activeRegion]['30-year'].scale1[gIdx];
                const scale2_30 = recalibrationFactors[activeRegion]['30-year'].scale2[gIdx];
                const calibratedRisk30 = 1 - Math.exp(-Math.exp(scale1_30 + scale2_30 * logLogRisk));
                const percent30 = Math.round(calibratedRisk30 * 100);
                display30Year = `<br><span class="lead">À 30 ans :</span> ${percent30}%`;
            }

            // Update UI
            errorSection.classList.add('d-none');
            resultSection.classList.remove('d-none');

            document.getElementById('risk-score').innerHTML =
                `<span class="lead">À 10 ans :</span> ${percent10}%` + display30Year;

        } catch (error) {
            resultSection.classList.add('d-none');
            errorSection.classList.remove('d-none');
            document.getElementById('error-message').innerText = error.message;
        }
    });
});
</script>
