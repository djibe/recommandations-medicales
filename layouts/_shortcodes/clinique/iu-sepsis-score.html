<p>1 point par signe clinique parmi:</p>
<ul>
  <li>+65 ans</li>
  <li>Température &gt; 38°C</li>
  <li>Pression artérielle systolique ≤ 110 mmHg</li>
  <li>Fréquence cardiaque &gt; 110/min</li>
  <li>SpO<sub>2</sub> ≤ 95 %</li>
  <li>Altération récente de l’état mental</li>
</ul>
<p>Risque d’évolution en sepsis &gt; 40 % dès 3 points.</p>
